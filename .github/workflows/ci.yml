name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          pip install ruff pytest
      - name: Validate JSON metadata
        run: |
          python -c "import json; [json.load(open(f)) for f in ('hacs.json', 'custom_components/visit_heatmap/manifest.json', 'custom_components/visit_heatmap/strings.json', 'custom_components/visit_heatmap/translations/en.json')]"
      - name: Lint
        run: ruff check custom_components/visit_heatmap --exclude custom_components/visit_heatmap/www
      - name: Test
        run: pytest

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Test card logic
        run: node --test custom_components/visit_heatmap/www_src/logic.test.mjs
      - name: Build card
        run: npm run build
      - name: Verify bundle
        run: node --check custom_components/visit_heatmap/www/visit-heatmap-card.js
      - name: Bundle matches committed output
        run: |
          npm run build
          git diff --exit-code custom_components/visit_heatmap/www/visit-heatmap-card.js